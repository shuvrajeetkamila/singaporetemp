name: Build island APK

on:
  workflow_dispatch:
  push:
    branches: [arena/4e2ebeb1-singaporetemp]
    paths:
      - "android/**"
      - "pipeline/**"
      - ".github/workflows/build-apk.yml"
      - "singapore_boundary.osm"
      - "rasters_COP30.tar.gz"
      - "Singapore.osm.pbf.001"
      - "Singapore.osm.pbf.002"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PBF_SHA256: 83770003e51ee0eb3cee0b891646e0b7c4d4518fc78bc7fabecb3ce8cc81e417
      PBF_BYTES: 38807616
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild and verify the Singapore OSM extract
        run: |
          mkdir -p /tmp/data
          cat Singapore.osm.pbf.001 Singapore.osm.pbf.002 > /tmp/data/Singapore.osm.pbf
          test "$(stat -c %s /tmp/data/Singapore.osm.pbf)" = "$PBF_BYTES"
          echo "$PBF_SHA256  /tmp/data/Singapore.osm.pbf" | sha256sum -c -

      - name: Unpack Copernicus GLO-30 surface model
        run: |
          tar -xzf rasters_COP30.tar.gz -C /tmp/data
          ls -la /tmp/data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/requirements-build.txt

      - name: Stage 2 - building footprints (clipped to the uploaded Singapore boundary)
        run: |
          PYTHONPATH=pipeline python -m sg_pipeline.osm_buildings /tmp/data/Singapore.osm.pbf \
            --out-db /tmp/data/buildings.sqlite \
            --report /tmp/data/buildings_report.json \
            --boundary-osm singapore_boundary.osm

      - name: Stage 3 - surface model to SVY21 grid
        run: |
          PYTHONPATH=pipeline python -m sg_pipeline.cop30_terrain /tmp/data/output_hh.tif \
            --out /tmp/data/singapore_dsm_svy21_30m.tif \
            --report /tmp/data/terrain_report.json

      - name: Stage 4 - export app assets
        run: |
          PYTHONPATH=pipeline python -m sg_pipeline.export_app_assets \
            --sqlite /tmp/data/buildings.sqlite \
            --dsm /tmp/data/singapore_dsm_svy21_30m.tif \
            --out android/island/src/main/assets/island \
            --stride 2
          cp /tmp/data/buildings_report.json /tmp/data/terrain_report.json android/island/src/main/assets/island/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and build tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore (only if the secret is set)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > /tmp/data/release.keystore
            echo "RELEASE_KEYSTORE_PATH=/tmp/data/release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore decoded; the bundle will be signed."
          else
            echo "No release keystore secret; the bundle will be unsigned."
          fi

      - name: Build debug APK and release app bundle
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease

      - name: Build sideloadable universal APK from the bundle (includes island data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee /tmp/data/bundletool.log) 2>&1
          set -x
          BT_URL=$(gh api repos/google/bundletool/releases/latest --jq '.assets[] | select(.name | test("^bundletool-all-.*[.]jar$")) | .browser_download_url')
          echo "bundletool: $BT_URL"
          curl -fsSL -o bundletool.jar "$BT_URL"
          ls -la bundletool.jar "$HOME/.android/" || true
          java -version
          java -jar bundletool.jar version
          java -jar bundletool.jar build-apks \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab \
            --output=/tmp/data/app.apks \
            --mode=universal \
            --ks="$HOME/.android/debug.keystore" \
            --ks-key-alias=androiddebugkey \
            --ks-pass=pass:android \
            --key-pass=pass:android
          unzip -p /tmp/data/app.apks universal.apk > "singapore-1to1-run${GITHUB_RUN_NUMBER}.apk"
          ls -la singapore-1to1-run*.apk

      - name: Keep bundletool log for diagnosis
        if: always()
        run: cp /tmp/data/bundletool.log ./bundletool.log 2>/dev/null || echo "no log" > ./bundletool.log

      - name: Upload bundletool log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundletool-log
          path: bundletool.log

      - name: Keep the release app bundle
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab "singapore-1to1-run${GITHUB_RUN_NUMBER}.aab"
          ls -la singapore-1to1-run*.aab
          du -h singapore-1to1-run*.aab

      - name: Upload APK and app bundle as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singapore-1to1-build
          path: |
            singapore-1to1-run*.apk
            singapore-1to1-run*.aab

      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="island-run-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "singapore-1to1-run${GITHUB_RUN_NUMBER}.apk" "singapore-1to1-run${GITHUB_RUN_NUMBER}.aab" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Singapore 1:1 island APK (run ${GITHUB_RUN_NUMBER})" \
            --notes "Debug APK built by GitHub Actions from commit ${GITHUB_SHA}. Building heights are estimates. Elevation is a surface model (includes buildings and trees). Data: OpenStreetMap contributors (ODbL); Copernicus DEM GLO-30 DLR/ESA via OpenTopography."
          echo "APK link: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/singapore-1to1-run${GITHUB_RUN_NUMBER}.apk"
