name: Build Vulkan APK

on:
  workflow_dispatch:
  push:
    branches: [arena/4e2ebeb1-singaporetemp]
    paths:
      - "android-vk/**"
      - "pipeline/**"
      - ".github/workflows/build-vulkan-apk.yml"
      - "singapore_boundary.osm"
      - "rasters_COP30.tar.gz"
      - "Singapore.osm.pbf.001"
      - "Singapore.osm.pbf.002"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PBF_SHA256: 83770003e51ee0eb3cee0b891646e0b7c4d4518fc78bc7fabecb3ce8cc81e417
      PBF_BYTES: 38807616
      NDK_VERSION: "26.1.10909125"
      CMAKE_VERSION: "3.22.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild and verify the Singapore OSM extract
        run: |
          mkdir -p /tmp/data
          cat Singapore.osm.pbf.001 Singapore.osm.pbf.002 > /tmp/data/Singapore.osm.pbf
          test "$(stat -c %s /tmp/data/Singapore.osm.pbf)" = "$PBF_BYTES"
          echo "$PBF_SHA256  /tmp/data/Singapore.osm.pbf" | sha256sum -c -

      - name: Unpack Copernicus GLO-30 surface model
        run: |
          tar -xzf rasters_COP30.tar.gz -C /tmp/data
          ls -la /tmp/data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/requirements-build.txt

      - name: Stage 2 - building footprints (clipped to the uploaded Singapore boundary)
        run: |
          PYTHONPATH=pipeline python -m sg_pipeline.osm_buildings /tmp/data/Singapore.osm.pbf \
            --out-db /tmp/data/buildings.sqlite \
            --report /tmp/data/buildings_report.json \
            --boundary-osm singapore_boundary.osm

      - name: Stage 3 - surface model to SVY21 grid
        run: |
          PYTHONPATH=pipeline python -m sg_pipeline.cop30_terrain /tmp/data/output_hh.tif \
            --out /tmp/data/singapore_dsm_svy21_30m.tif \
            --report /tmp/data/terrain_report.json

      - name: Stage 4 - island base-detail export (60 m terrain, all buildings)
        run: |
          PYTHONPATH=pipeline python -m sg_pipeline.export_app_assets \
            --sqlite /tmp/data/buildings.sqlite \
            --dsm /tmp/data/singapore_dsm_svy21_30m.tif \
            --out /tmp/data/island_out \
            --stride 2

      - name: Pack island and pilot assets into the app
        working-directory: android-vk
        run: |
          python3 tools/pack_island.py /tmp/data/island_out \
            --pilot-meta app/src/main/assets/district/meta.json \
            --out app/src/main/assets/island
          cp /tmp/data/buildings_report.json /tmp/data/terrain_report.json app/src/main/assets/island/ || true
          ls -la app/src/main/assets/island
          du -sh app/src/main/assets/island

      - name: Host tests for the portable core (parsers, meshes, island layer, simulation)
        working-directory: android-vk
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Iapp/src/main/cpp \
            tests/host_test.cpp app/src/main/cpp/world.cpp app/src/main/cpp/sim.cpp \
            app/src/main/cpp/agents.cpp app/src/main/cpp/island.cpp \
            -o /tmp/host_test
          /tmp/host_test app/src/main/assets/district

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform, build tools, NDK and CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "NDK_DIR=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Compile shaders to SPIR-V with the NDK glslc
        working-directory: android-vk
        run: |
          GLSLC="$(find "$NDK_DIR" -name glslc -type f 2>/dev/null | head -n 1 || true)"
          if [ -z "$GLSLC" ]; then
            echo "glslc not found in the NDK; installing the distribution package"
            sudo apt-get update -y
            sudo apt-get install -y glslc
            GLSLC="$(command -v glslc)"
          fi
          echo "Using $GLSLC"
          mkdir -p app/src/main/assets/shaders
          "$GLSLC" -fshader-stage=vert app/src/main/shaders/mesh.vert -o app/src/main/assets/shaders/mesh.vert.spv
          "$GLSLC" -fshader-stage=frag app/src/main/shaders/mesh.frag -o app/src/main/assets/shaders/mesh.frag.spv
          ls -la app/src/main/assets/shaders

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-vk
        run: gradle --no-daemon :app:assembleDebug

      - name: Check the APK contents and name it
        run: |
          APK=android-vk/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/apk-contents.txt
          grep -q "lib/arm64-v8a/libvkisland.so" /tmp/apk-contents.txt
          grep -q "assets/shaders/mesh.vert.spv" /tmp/apk-contents.txt
          grep -q "assets/shaders/mesh.frag.spv" /tmp/apk-contents.txt
          grep -q "assets/district/terrain.bin" /tmp/apk-contents.txt
          grep -q "assets/district/buildings.bin" /tmp/apk-contents.txt
          grep -q "assets/district/roads.bin" /tmp/apk-contents.txt
          grep -q "assets/island/terrain.bin" /tmp/apk-contents.txt
          grep -q "assets/island/buildings.bin" /tmp/apk-contents.txt
          grep -q "assets/island/layout.txt" /tmp/apk-contents.txt
          cp "$APK" "singapore-vk-run${GITHUB_RUN_NUMBER}.apk"
          ls -la singapore-vk-run*.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: singapore-vk-build
          path: singapore-vk-run*.apk

      - name: Publish APK as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vk-run-${GITHUB_RUN_NUMBER}"
          APK="singapore-vk-run${GITHUB_RUN_NUMBER}.apk"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Singapore Vulkan APK (run ${GITHUB_RUN_NUMBER})" \
            --notes "Native Vulkan build from commit ${GITHUB_SHA}. Whole island at base detail (60 m terrain, extruded buildings). Pilot district Marina Bay at full detail (30 m terrain, roads, cars and pedestrians). Building heights are ESTIMATED. Elevation: Copernicus DEM GLO-30 (c) DLR/ESA via OpenTopography (surface model, includes buildings and trees). Buildings and roads: OpenStreetMap contributors (ODbL). Screen colours: blue = loading, magenta = data failed, orange = scene setup failed, red = Vulkan not available, sky blue = running."
          echo "APK link: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}"
