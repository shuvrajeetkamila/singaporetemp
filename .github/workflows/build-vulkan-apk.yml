name: Build Vulkan pilot APK

on:
  workflow_dispatch:
  push:
    branches: [arena/4e2ebeb1-singaporetemp]
    paths:
      - "android-vk/**"
      - ".github/workflows/build-vulkan-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: "26.1.10909125"
      CMAKE_VERSION: "3.22.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform, build tools, NDK and CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "NDK_DIR=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Host tests for the portable core (parsers, mesh, simulation)
        working-directory: android-vk
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Iapp/src/main/cpp \
            tests/host_test.cpp app/src/main/cpp/world.cpp app/src/main/cpp/sim.cpp app/src/main/cpp/agents.cpp \
            -o /tmp/host_test
          /tmp/host_test app/src/main/assets/district

      - name: Compile shaders to SPIR-V with the NDK glslc
        working-directory: android-vk
        run: |
          GLSLC="$(find "$NDK_DIR" -name glslc -type f 2>/dev/null | head -n 1 || true)"
          if [ -z "$GLSLC" ]; then
            echo "glslc not found in the NDK; installing the distribution package"
            sudo apt-get update -y
            sudo apt-get install -y glslc
            GLSLC="$(command -v glslc)"
          fi
          echo "Using $GLSLC"
          mkdir -p app/src/main/assets/shaders
          "$GLSLC" -fshader-stage=vert app/src/main/shaders/mesh.vert -o app/src/main/assets/shaders/mesh.vert.spv
          "$GLSLC" -fshader-stage=frag app/src/main/shaders/mesh.frag -o app/src/main/assets/shaders/mesh.frag.spv
          ls -la app/src/main/assets/shaders

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-vk
        run: gradle --no-daemon :app:assembleDebug

      - name: Check the APK contents and name it
        run: |
          APK=android-vk/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/apk-contents.txt
          grep -q "lib/arm64-v8a/libvkisland.so" /tmp/apk-contents.txt
          grep -q "assets/shaders/mesh.vert.spv" /tmp/apk-contents.txt
          grep -q "assets/shaders/mesh.frag.spv" /tmp/apk-contents.txt
          grep -q "assets/district/terrain.bin" /tmp/apk-contents.txt
          grep -q "assets/district/buildings.bin" /tmp/apk-contents.txt
          grep -q "assets/district/roads.bin" /tmp/apk-contents.txt
          cp "$APK" "singapore-vk-run${GITHUB_RUN_NUMBER}.apk"
          ls -la singapore-vk-run*.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: singapore-vk-build
          path: singapore-vk-run*.apk

      - name: Publish APK as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vk-run-${GITHUB_RUN_NUMBER}"
          APK="singapore-vk-run${GITHUB_RUN_NUMBER}.apk"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Singapore Vulkan pilot APK (run ${GITHUB_RUN_NUMBER})" \
            --notes "Native Vulkan pilot built by GitHub Actions from commit ${GITHUB_SHA}. Pilot district: Marina Bay at 30 m terrain. Buildings have ESTIMATED heights. Roads and footpaths; cars and pedestrians move on the road graph. Boats and aircraft are not included. Elevation: Copernicus DEM GLO-30 (c) DLR/ESA via OpenTopography. Buildings and roads: OpenStreetMap contributors (ODbL)."
          echo "APK link: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}"
